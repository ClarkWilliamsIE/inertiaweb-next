<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    
    /* Buttons & Inputs */
    .row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .btn {
      padding: .5rem .85rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1f1f1f;
      color: #fff;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .btn:hover { background: #2a2a2a; transform: translateY(-1px); }
    .danger { border-color: #7f1d1d; color: #fca5a5; }
    .danger:hover { background: #450a0a; }

    /* Toggle Switch */
    .switch {
      position: relative; display: inline-block; width: 46px; height: 24px; vertical-align: middle;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #333; transition: .2s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: #3b82f6; }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Top Stats Bar */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-box {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 1.25rem;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .stat-label { font-size: 0.85rem; color: #a1a1aa; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: #fff; }
    
    .text-green { color: #4ade80; }
    .text-red { color: #f87171; }
    .text-blue { color: #60a5fa; }

    /* Dashboard Grid */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 1.5rem;
      /* Smooth transition for height changes */
      min-height: 500px; 
    }
    .chart-card {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
    }
    .chart-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: 1rem;
    }
    .chart-card h2 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    .chart-container { position: relative; flex: 1; height: 240px; width: 100%; }

    /* Range Tabs */
    .range-tabs {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      background: #27272a;
      padding: 4px;
      border-radius: 99px;
      width: fit-content;
      margin-left: auto; margin-right: auto;
    }
    .range-tab {
      padding: 0.35rem 0.85rem;
      border-radius: 99px;
      border: none;
      background: transparent;
      font-size: 0.75rem;
      color: #a1a1aa;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
    }
    .range-tab:hover { color: #fff; }
    .range-tab.active {
      background: #3f3f46;
      color: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    /* View Toggle (Summary/History) */
    .view-toggle {
      display: inline-flex;
      border-radius: 8px;
      background: #27272a;
      padding: 2px;
    }
    .view-toggle button {
      padding: 0.25rem 0.75rem;
      border: none;
      background: transparent;
      color: #a1a1aa;
      cursor: pointer;
      font-size: 0.75rem;
      border-radius: 6px;
      font-weight: 500;
    }
    .view-toggle button.active {
      background: #52525b;
      color: #fff;
    }

    .notice {
      padding: 1rem;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      background: #18181b;
      margin-bottom: 1rem;
      color: #fbbf24;
    }
    .last-updated {
        font-size: 0.75rem;
        color: #71717a;
        text-align: right;
        margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Members Dashboard</h1>
    <div class="row">
      <label class="row" style="gap:.5rem; font-size: 0.9rem; color: #a1a1aa;">
        <span>Divide by 12</span>
        <span class="switch">
          <input type="checkbox" id="divideToggle" />
          <span class="slider"></span>
        </span>
      </label>
      <button class="btn" onclick="location.href='watchlist.html'">Watchlist</button>
      <button class="btn" onclick="location.href='polls.html'">Polls</button>
      <button class="btn danger" id="btnSignOut">Sign out</button>
    </div>
  </header>

  <div id="status" class="notice" style="display:none;"></div>
  <div id="statsGrid" class="stats-grid" style="display:none;"></div>
  <div class="dashboard" id="dashboard"></div>
  <div id="lastUpdated" class="last-updated" style="display:none;"></div>

  <script>
    const SUPABASE_URL = "https://acdlgvcxzxjvcwiqlydj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZGxndmN4enhqdmN3aXFseWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2Mjc5NzksImV4cCI6MjA3MjIwMzk3OX0.9ZUURjJT73Igd2tAOv8aSZUmlkEf7DIzmOAGBSjWqCI";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById("status");
    const statsGridEl = document.getElementById("statsGrid");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const dashboardEl = document.getElementById("dashboard");

    function setStatus(msg) { statusEl.textContent = msg; statusEl.style.display = msg ? "block" : "none"; }

    document.getElementById("btnSignOut").addEventListener("click", async () => {
      await supabase.auth.signOut();
      location.href = "login.html";
    });

    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) location.href = "login.html";
    })();

    let summary = null;
    let charts = [];
    let currentRange = "YEAR"; 
    const divideToggle = document.getElementById("divideToggle");
    const tickerViewMode = {};

    const RANGE_KEY = "pfRange";
    const VIEW_KEY = "pfViewMode";

    try { currentRange = localStorage.getItem(RANGE_KEY) || "YEAR"; } catch(_){}
    try { Object.assign(tickerViewMode, JSON.parse(localStorage.getItem(VIEW_KEY) || "{}")); } catch(_){}

    function savePrefs() {
      try {
        localStorage.setItem(RANGE_KEY, currentRange);
        localStorage.setItem(VIEW_KEY, JSON.stringify(tickerViewMode));
      } catch(_){}
    }

    function destroyCharts() {
      charts.forEach(c => { try { c.destroy(); } catch (_) {} });
      charts = [];
    }

    function fmtMoney(v, showSign=false) {
      if (v == null) return "0";
      const s = Math.round(Number(v)).toLocaleString();
      return showSign ? "$" + s : s;
    }
    function fmtPct(v) {
      if (v == null) return "n/a";
      return Number(v).toFixed(2);
    }
    function shortDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return iso;
      const m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
      return `${d.getDate()} ${m[d.getMonth()]}`;
    }

    function consolidateByDay(arr) {
      const map = new Map();
      arr.forEach(item => {
        const dateKey = item[0].split("T")[0];
        map.set(dateKey, item);
      });
      return Array.from(map.values());
    }

    async function loadData() {
      setStatus("Loading data...");
      
      const { data: summaryData, error: summaryError } = await supabase
        .from("flex_summary")
        .select("*")
        .order("last_updated", { ascending: false })
        .limit(1);

      if (summaryError || !summaryData?.length) {
        setStatus("No data available.");
        return;
      }

      const row = summaryData[0];
      summary = row.data || {};
      summary.lastUpdatedDate = row.last_updated;

      const { data: historyData } = await supabase
        .from("flex_summary")
        .select("data, last_updated")
        .order("last_updated", { ascending: true })
        .limit(5000);

      const rawPf = [];
      const rawSym = {};

      (historyData || []).forEach(r => {
        const d = r.data;
        const dt = d.lastUpdated || r.last_updated;
        if(!dt) return;

        const val = Number(d.totals?.value || 0);
        if (isFinite(val)) rawPf.push([dt, val]);

        (d.positions || []).forEach(p => {
          if(p?.symbol) {
            if(!rawSym[p.symbol]) rawSym[p.symbol] = [];
            rawSym[p.symbol].push([dt, Number(p.value||0)]);
          }
        });
      });

      summary.history = consolidateByDay(rawPf);
      summary.symbolHistory = {};
      for(const k in rawSym) summary.symbolHistory[k] = consolidateByDay(rawSym[k]);

      setStatus("");
      render(divideToggle.checked);
    }

    function filterRange(hist, range) {
      if (!hist?.length) return [];
      const end = new Date(hist[hist.length-1][0]).getTime();
      const day = 86400000;
      let days = 365;
      if (range === "WEEK") days = 7;
      if (range === "MONTH") days = 30;
      if (range === "SIX_MONTHS") days = 180;
      
      const start = end - (days * day);
      return hist.filter(pt => new Date(pt[0]).getTime() >= start);
    }

    // --- THE FIX: Scroll Preserving Render ---
    function reRender() {
      // 1. Capture current scroll position
      const currentY = window.scrollY;
      
      // 2. Lock the height of the container so it doesn't collapse
      dashboardEl.style.minHeight = dashboardEl.offsetHeight + 'px';
      
      // 3. Render
      render(divideToggle.checked);

      // 4. Restore scroll immediately
      window.scrollTo(0, currentY);

      // 5. Release the height lock (optional, but good practice)
      setTimeout(() => {
        dashboardEl.style.minHeight = '500px'; // reset to default min-height
      }, 50);
    }

    function render(divide) {
      dashboardEl.innerHTML = "";
      destroyCharts();

      const f = divide ? 12 : 1;
      const totals = summary.totals || {};
      const positions = summary.positions || [];

      // Stats Grid
      const tVal = (totals.value || 0) / f;
      const tCost = (totals.cost || 0) / f;
      const tProf = (totals.profit || 0) / f;
      const tPct = totals.pct || 0;

      statsGridEl.style.display = "grid";
      statsGridEl.innerHTML = `
        <div class="stat-box">
          <div class="stat-label">Total Value</div>
          <div class="stat-value text-blue">${fmtMoney(tVal, true)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Cost</div>
          <div class="stat-value">${fmtMoney(tCost, true)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Total Profit</div>
          <div class="stat-value ${tProf>=0?'text-green':'text-red'}">
            ${tProf>=0?'+':''}${fmtMoney(tProf, true)}
          </div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Return</div>
          <div class="stat-value ${tPct>=0?'text-green':'text-red'}">
            ${tPct>=0?'+':''}${fmtPct(tPct)}%
          </div>
        </div>
      `;

      if(summary.lastUpdatedDate) {
        lastUpdatedEl.textContent = "Last updated: " + new Date(summary.lastUpdatedDate).toLocaleString();
        lastUpdatedEl.style.display = "block";
      }

      // Allocation Donut
      const donutCard = mkCard("Allocation " + (f>1?"(1/12)":""));
      dashboardEl.appendChild(donutCard);
      
      charts.push(new Chart(donutCard.querySelector("canvas"), {
        type: 'doughnut',
        data: {
          labels: positions.map(p => p.symbol),
          datasets: [{
            data: positions.map(p => (p.value||0)/f),
            backgroundColor: [
              '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'
            ],
            borderWidth: 0,
            hoverOffset: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'right', labels: { color: '#d4d4d8', boxWidth: 12 } } },
          cutout: '65%'
        }
      }));

      // Summary Bar
      const barCard = mkCard("Summary " + (f>1?"(1/12)":""));
      dashboardEl.appendChild(barCard);
      charts.push(new Chart(barCard.querySelector("canvas"), {
        type: 'bar',
        data: {
          labels: ["Spent", "Profit", "Value"],
          datasets: [{
            data: [tCost, tProf, tVal],
            backgroundColor: [
              '#3f3f46', 
              tProf >= 0 ? '#10b981' : '#ef4444', 
              '#3b82f6'
            ],
            borderRadius: 6
          }]
        },
        options: stdOptions({ showLegend: false })
      }));

      // Portfolio History
      const lineCard = document.createElement("div");
      lineCard.className = "chart-card";
      lineCard.innerHTML = `
        <div class="chart-card-header"><h2>Portfolio Value</h2></div>
        <div class="range-tabs">
          ${['WEEK','MONTH','SIX_MONTHS','YEAR'].map(k => 
            `<button class="range-tab ${currentRange===k?'active':''}" data-k="${k}">
              ${k.replace('_',' ').toLowerCase()}
            </button>`
          ).join('')}
        </div>
        <div class="chart-container"><canvas></canvas></div>
      `;
      dashboardEl.appendChild(lineCard);
      
      lineCard.querySelectorAll(".range-tab").forEach(b => {
        b.onclick = () => {
          currentRange = b.dataset.k;
          savePrefs();
          reRender(); // Use reRender here
        };
      });

      const pfHist = filterRange(summary.history, currentRange);
      const pfCtx = lineCard.querySelector("canvas").getContext("2d");
      const pfGrad = pfCtx.createLinearGradient(0, 0, 0, 300);
      pfGrad.addColorStop(0, 'rgba(59, 130, 246, 0.5)');
      pfGrad.addColorStop(1, 'rgba(59, 130, 246, 0.0)');

      charts.push(new Chart(pfCtx, {
        type: 'line',
        data: {
          labels: pfHist.map(p => shortDate(p[0])),
          datasets: [{
            label: "Value",
            data: pfHist.map(p => (p[1]||0)/f),
            borderColor: '#3b82f6',
            backgroundColor: pfGrad,
            fill: true,
            tension: 0.3,
            pointRadius: 0,
            pointHoverRadius: 6,
            borderWidth: 2
          }]
        },
        options: stdOptions({ showLegend: false, intersect: false })
      }));

      // Ticker Cards
      positions.forEach(p => {
        const sym = p.symbol;
        const mode = tickerViewMode[sym] || "SUMMARY";
        
        const card = document.createElement("div");
        card.className = "chart-card";
        const isUp = (p.profit||0) >= 0;
        card.style.borderTop = `4px solid ${isUp ? '#10b981' : '#ef4444'}`;

        card.innerHTML = `
          <div class="chart-card-header">
            <h2>${sym}</h2>
            <div class="view-toggle">
              <button data-m="SUMMARY" class="${mode==='SUMMARY'?'active':''}">Sum</button>
              <button data-m="HISTORY" class="${mode==='HISTORY'?'active':''}">Hist</button>
            </div>
          </div>
          <div class="chart-container"><canvas></canvas></div>
        `;
        dashboardEl.appendChild(card);

        card.querySelectorAll("button").forEach(b => {
          b.onclick = () => {
            tickerViewMode[sym] = b.dataset.m;
            savePrefs();
            reRender(); // Use reRender here
          };
        });

        const ctx = card.querySelector("canvas").getContext("2d");
        const pCost = (p.cost||0)/f;
        const pVal = (p.value||0)/f;
        const pProf = (p.profit||0)/f;
        const pPct = p.pct;

        if (mode === "HISTORY" && summary.symbolHistory[sym]) {
          const sHist = filterRange(summary.symbolHistory[sym], currentRange);
          const sGrad = ctx.createLinearGradient(0, 0, 0, 300);
          sGrad.addColorStop(0, 'rgba(249, 115, 22, 0.5)');
          sGrad.addColorStop(1, 'rgba(249, 115, 22, 0.0)');

          charts.push(new Chart(ctx, {
            type: 'line',
            data: {
              labels: sHist.map(x => shortDate(x[0])),
              datasets: [{
                label: "Value",
                data: sHist.map(x => (x[1]||0)/f),
                borderColor: '#f97316',
                backgroundColor: sGrad,
                fill: true,
                tension: 0.3,
                pointRadius: 0,
                pointHoverRadius: 5
              }]
            },
            options: stdOptions({ showLegend: false, intersect: false })
          }));
        } else {
          charts.push(new Chart(ctx, {
            data: {
              labels: ["Cost", "Value", "Profit", "%"],
              datasets: [
                {
                  type: 'bar',
                  label: 'NZD',
                  data: [pCost, pVal, pProf, null],
                  backgroundColor: [
                    '#3f3f46', 
                    '#3b82f6',
                    pProf>=0 ? '#10b981' : '#ef4444',
                    null
                  ],
                  borderRadius: 4,
                  yAxisID: 'y'
                },
                {
                  type: 'line',
                  label: '%',
                  data: [null, null, null, pPct],
                  borderColor: '#fbbf24',
                  borderWidth: 2,
                  pointBackgroundColor: '#fbbf24',
                  yAxisID: 'yPct'
                }
              ]
            },
            options: {
              ...stdOptions({ showLegend: false }),
              scales: {
                y: { 
                  beginAtZero: true, 
                  grid: { color: '#27272a' },
                  ticks: { callback: v=>fmtMoney(v), color: '#a1a1aa' }
                },
                yPct: {
                  type: 'linear',
                  position: 'right',
                  grid: { display: false },
                  ticks: { callback: v=>v+'%', color: '#a1a1aa' }
                },
                x: { grid: { display: false }, ticks: { color: '#a1a1aa' } }
              }
            }
          }));
        }
      });
    }

    function mkCard(title) {
      const d = document.createElement("div");
      d.className = "chart-card";
      d.innerHTML = `<div class="chart-card-header"><h2>${title}</h2></div><div class="chart-container"><canvas></canvas></div>`;
      return d;
    }

    function stdOptions({ showLegend=true, intersect=true } = {}) {
      return {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: intersect },
        plugins: {
          legend: { display: showLegend, labels: { color: '#fff' } },
          tooltip: {
            backgroundColor: 'rgba(24, 24, 27, 0.9)',
            titleColor: '#fff',
            bodyColor: '#e4e4e7',
            borderColor: '#3f3f46',
            borderWidth: 1,
            callbacks: {
              label: ctx => {
                if(ctx.dataset.type==='line' && ctx.chart.config.type!=='line') return fmtPct(ctx.raw) + '%';
                return fmtMoney(ctx.raw);
              }
            }
          }
        },
        scales: {
          y: { 
            grid: { color: '#27272a' },
            ticks: { color: '#a1a1aa', callback: v => fmtMoney(v) }
          },
          x: {
            grid: { display: false },
            ticks: { color: '#a1a1aa', maxTicksLimit: 8 }
          }
        }
      };
    }

    loadData();
    divideToggle.onchange = () => reRender(); // Use reRender here
  </script>
</body>
</html>
