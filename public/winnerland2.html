<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members Dashboard</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #121212;
      color: #fff;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-bottom: .75rem;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    .row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .btn {
      padding: .5rem .75rem;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #1f2937;
      color: #fff;
      cursor: pointer;
    }
    .btn:hover { background: #273244; }
    .danger { border-color: #ef4444; }
    /* toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      vertical-align: middle;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background-color: #333; transition: .2s; border-radius: 26px;
    }
    .slider:before {
      position: absolute; content: "";
      height: 18px; width: 18px; left: 4px; bottom: 4px;
      background: #fff; transition: .2s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(24px); }

    /* grid and cards */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .chart-card {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
      display: flex;
      flex-direction: column;
    }
    .chart-card h2 {
      margin: 0 0 .5rem 0;
      font-size: 1.05rem;
      text-align: center;
    }
    .chart-container {
      position: relative;
      flex: 1;
      height: 220px;
    }
    .chart-container canvas { width: 100% !important; height: 100% !important; }

    .notice {
      padding: .75rem;
      border: 1px solid #444;
      border-radius: 10px;
      background: #181818;
      font-size: .95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Members dashboard</h1>
    <div class="row">
      <label class="row" style="gap:.35rem;">
        <span>Divide by 12</span>
        <span class="switch">
          <input type="checkbox" id="divideToggle" />
          <span class="slider"></span>
        </span>
      </label>
      <button class="btn" onclick="location.href='watchlist.html'">Watchlist</button>
      <button class="btn" onclick="location.href='polls.html'">Polls</button>
      <button class="btn danger" id="btnSignOut">Sign out</button>
    </div>
  </header>

  <div id="status" class="notice" style="display:none;"></div>
  <div class="dashboard" id="dashboard"></div>

  <script>
    /* Supabase client */
    const SUPABASE_URL = "https://acdlgvcxzxjvcwiqlydj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZGxndmN4enhqdmN3aXFseWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2Mjc5NzksImV4cCI6MjA3MjIwMzk3OX0.9ZUURjJT73Igd2tAOv8aSZUmlkEf7DIzmOAGBSjWqCI";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById("status");
    function setStatus(msg) {
      statusEl.textContent = msg;
      statusEl.style.display = msg ? "block" : "none";
    }

    /* Auth guard */
    document.getElementById("btnSignOut").addEventListener("click", async () => {
      await supabase.auth.signOut();
      location.href = "login.html";
    });
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) location.href = "login.html";
    })();

    /* Data source, Supabase summary */
    let summary = null;

    async function loadSummary() {
      setStatus("Loading summary from Supabase...");
      // Try the view first
      let { data, error } = await supabase
        .from("flex_summary_latest")
        .select("*")
        .maybeSingle();

      if (error && error.code !== "PGRST116") {
        console.error(error);
      }

      if (!data) {
        // Fallback to table if the view does not exist
        const res = await supabase
          .from("flex_summary")
          .select("*")
          .order("last_updated", { ascending: false })
          .limit(1);
        if (res.error) {
          console.error(res.error);
          setStatus("Could not load summary. Check RLS and that your Edge Function is inserting rows.");
          return;
        }
        data = res.data?.[0] ?? null;
      }

      summary = data?.data ?? null;
      if (!summary) {
        setStatus("No summary available yet. The sync job may not have written a row.");
        return;
      }
      setStatus("");
    }

    /* Charts */
    let charts = [];
    function destroyCharts() {
      charts.forEach(c => { try { c.destroy(); } catch(_){} });
      charts = [];
    }

    function renderCharts(divideBy12) {
      if (!summary) return;
      const f = divideBy12 ? 12 : 1;
      const dashboard = document.getElementById("dashboard");
      dashboard.innerHTML = "";
      destroyCharts();

      const totalValue = Number(summary.totalValue || 0);
      // We intentionally do not publish total spent or profit in the summary
      const totalSpent = 0;
      const totalProfit = totalValue - totalSpent;

      // Build rows from topSymbols for reuse with your card rendering
      const rawRows = (summary.topSymbols || []).map(x => ({
        Ticker: x.symbol,
        NZD: Number(x.value || 0)
      }));

      // PIE card
      const pieCard = document.createElement("div");
      pieCard.className = "chart-card";
      pieCard.innerHTML = `
        <h2>Allocation ${f>1 ? "(per 1 of 12)" : ""}</h2>
        <div class="chart-container"><canvas id="summaryPie"></canvas></div>
      `;
      dashboard.appendChild(pieCard);

      // BAR card
      const barCard = document.createElement("div");
      barCard.className = "chart-card";
      barCard.innerHTML = `
        <h2>Portfolio summary ${f>1 ? "(per 1 of 12)" : ""}</h2>
        <div class="chart-container"><canvas id="summaryBar"></canvas></div>
      `;
      dashboard.appendChild(barCard);

      // LINE card
      const lineCard = document.createElement("div");
      lineCard.className = "chart-card";
      lineCard.innerHTML = `
        <h2>Portfolio value over time</h2>
        <div class="chart-container"><canvas id="portfolioValueLine"></canvas></div>
      `;
      dashboard.appendChild(lineCard);

      // Line data, use history if provided, else one point
      let lineLabels = [];
      let lineData = [];
      if (Array.isArray(summary.history) && summary.history.length) {
        lineLabels = summary.history.map(p => p[0]);
        lineData = summary.history.map(p => Number(p[1] || 0));
      } else {
        lineLabels = [summary.lastUpdated || new Date().toISOString()];
        lineData = [totalValue];
      }
      const minValue = Math.min(...lineData);
      const maxValue = Math.max(...lineData);
      const margin = Math.max((maxValue - minValue) * 0.1, 1);

      charts.push(new Chart(document.getElementById("portfolioValueLine"), {
        type: "line",
        data: {
          labels: lineLabels,
          datasets: [{
            label: "Portfolio value NZD",
            data: lineData,
            fill: false,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: minValue - margin,
              max: maxValue + margin,
              ticks: { callback: v => "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2 }) },
              grid: { color: "#444", borderColor: "#444" }
            },
            x: { grid: { color: "#444" } }
          },
          plugins: {
            legend: { labels: { color: "#fff" } }
          }
        }
      }));

      // PIE
      const pieLabels = rawRows.map(r => r.Ticker);
      const pieData = rawRows.map(r => r.NZD / f);
      charts.push(new Chart(document.getElementById("summaryPie"), {
        type: "doughnut",
        data: { labels: pieLabels, datasets: [{ data: pieData }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "right", labels: { color: "#fff" } } },
          elements: { arc: { borderWidth: 0 } }
        }
      }));

      // BAR
      charts.push(new Chart(document.getElementById("summaryBar"), {
        type: "bar",
        data: {
          labels: ["Spent", "Profit", "Value"],
          datasets: [{
            label: "NZD",
            data: [ totalSpent / f, totalProfit / f, totalValue / f ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: v => "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2 }) },
              grid: { color: "#444", borderColor: "#444" }
            },
            x: { grid: { color: "#444" } }
          },
          plugins: { legend: { display: false } }
        }
      }));

      // Per holding cards
      rawRows.forEach(r => {
        const mvNzd = Number(r.NZD || 0);
        const profitNzd = mvNzd; // cost hidden, so this is just a visual cue

        const card = document.createElement("div");
        card.className = "chart-card";
        card.innerHTML = `
          <h2>${r.Ticker}</h2>
          <div class="chart-container"><canvas id="chart-${r.Ticker}"></canvas></div>
        `;
        dashboard.appendChild(card);

        card.style.borderColor = profitNzd >= 0 ? "#28a745" : "#dc3545";

        charts.push(new Chart(document.getElementById(`chart-${r.Ticker}`), {
          data: {
            labels: ["Value"],
            datasets: [
              {
                type: "bar",
                label: "NZD",
                data: [ mvNzd / f ]
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              y: {
                beginAtZero: true,
                title: { display: true, text: "NZD" },
                ticks: { callback: v => "$" + Number(v).toLocaleString() },
                grid: { color: "#444" }
              }
            },
            plugins: {
              legend: { position: "bottom" }
            }
          }
        }));
      });
    }

    // Boot
    (async () => {
      await loadSummary();
      if (summary) {
        renderCharts(false);
        document.getElementById("divideToggle")
          .addEventListener("change", e => renderCharts(e.target.checked));
      }
    })();
  </script>
</body>
</html>
