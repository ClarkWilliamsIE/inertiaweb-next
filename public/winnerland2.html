<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members Dashboard</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 1rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #121212;
      color: #fff;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      margin-bottom: .75rem;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    .row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .btn {
      padding: .5rem .75rem;
      border-radius: 10px;
      border: 1px solid #2a2a2a;
      background: #1f2937;
      color: #fff;
      cursor: pointer;
    }
    .btn:hover { background: #273244; }
    .danger { border-color: #ef4444; }
    .switch {
      position: relative; display: inline-block; width: 50px; height: 26px; vertical-align: middle;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #333; transition: .2s; border-radius: 26px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px; background: #fff; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(24px); }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .chart-card {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
      display: flex;
      flex-direction: column;
    }
    .chart-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: .5rem;
    }
    .chart-card h2 {
      margin: 0;
      font-size: 1.05rem;
      text-align: left;
    }
    .chart-container { position: relative; flex: 1; height: 220px; }
    .chart-container canvas { width: 100% !important; height: 100% !important; }

    .notice {
      padding: .75rem;
      border: 1px solid #444;
      border-radius: 10px;
      background: #181818;
      font-size: .95rem;
    }

    .range-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.5rem;
    }
    .range-tab {
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      border: 1px solid #333;
      background: #111827;
      font-size: 0.8rem;
      color: #cbd5f5;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .range-tab:hover {
      background: #1f2937;
      border-color: #444;
    }
    .range-tab.active {
      background: #2563eb;
      border-color: #2563eb;
      color: #fff;
    }

    .view-toggle {
      display: inline-flex;
      border-radius: 999px;
      border: 1px solid #374151;
      overflow: hidden;
      background: #111827;
      font-size: 0.75rem;
    }
    .view-toggle button {
      padding: 0.15rem 0.6rem;
      border: none;
      background: transparent;
      color: #9ca3af;
      cursor: pointer;
      font: inherit;
    }
    .view-toggle button.active {
      background: #2563eb;
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>Members dashboard</h1>
    <div class="row">
      <label class="row" style="gap:.35rem;">
        <span>Divide by 12</span>
        <span class="switch">
          <input type="checkbox" id="divideToggle" />
          <span class="slider"></span>
        </span>
      </label>
      <button class="btn" onclick="location.href='watchlist.html'">Watchlist</button>
      <button class="btn" onclick="location.href='polls.html'">Polls</button>
      <button class="btn danger" id="btnSignOut">Sign out</button>
    </div>
  </header>

  <div id="status" class="notice" style="display:none;"></div>
  <div class="dashboard" id="dashboard"></div>

  <script>
    const SUPABASE_URL = "https://acdlgvcxzxjvcwiqlydj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZGxndmN4enhqdmN3aXFseWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2Mjc5NzksImV4cCI6MjA3MjIwMzk3OX0.9ZUURjJT73Igd2tAOv8aSZUmlkEf7DIzmOAGBSjWqCI";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById("status");
    function setStatus(msg) { statusEl.textContent = msg; statusEl.style.display = msg ? "block" : "none"; }

    document.getElementById("btnSignOut").addEventListener("click", async () => {
      await supabase.auth.signOut();
      location.href = "login.html";
    });
    (async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) location.href = "login.html";
    })();

    let summary = null;
    let charts = [];
    let currentRange = "YEAR"; // WEEK, MONTH, SIX_MONTHS, YEAR
    const divideToggle = document.getElementById("divideToggle");

    const tickerViewMode = {}; // symbol -> "SUMMARY" or "HISTORY"

    function destroyCharts() {
      charts.forEach(c => { try { c.destroy(); } catch (_) {} });
      charts = [];
    }

    function money(v) {
      return "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    async function loadSummary() {
      setStatus("Loading summary from Supabase...");
      let { data, error } = await supabase
        .from("flex_summary_latest")
        .select("*")
        .maybeSingle();

      if (error && error.code !== "PGRST116") {
        console.error(error);
      }

      if (!data) {
        const res = await supabase
          .from("flex_summary")
          .select("*")
          .order("last_updated", { ascending: false })
          .limit(1);
        if (res.error) {
          console.error(res.error);
          setStatus("Could not load summary. Check RLS and inserts.");
          return;
        }
        data = res.data?.[0] ?? null;
      }

      summary = data?.data ?? null;
      if (!summary) {
        setStatus("No summary available yet.");
        return;
      }
      setStatus("");
    }

    async function loadHistoryFromTable() {
      // builds summary.history and summary.symbolHistory from flex_summary rows
      const { data, error } = await supabase
        .from("flex_summary")
        .select("data,last_updated")
        .order("last_updated", { ascending: true })
        .limit(5000);

      if (error) {
        console.error(error);
        return;
      }

      const rows = Array.isArray(data) ? data : [];
      const portfolioHistory = [];
      const symbolHistoryMap = {};

      for (const row of rows) {
        const d = row.data || {};
        const date = d.lastUpdated || row.last_updated;
        if (!date) continue;

        const totals = d.totals || {};
        const v = Number(totals.value || 0);
        if (Number.isFinite(v)) {
          portfolioHistory.push([date, v]);
        }

        const positions = Array.isArray(d.positions) ? d.positions : [];
        for (const p of positions) {
          if (!p || !p.symbol) continue;
          const sym = p.symbol;
          const val = Number(p.value || 0);
          if (!Number.isFinite(val)) continue;
          if (!symbolHistoryMap[sym]) symbolHistoryMap[sym] = [];
          symbolHistoryMap[sym].push([date, val]);
        }
      }

      summary.history = portfolioHistory;
      summary.symbolHistory = symbolHistoryMap;
    }

    function filterHistoryByRange(history, rangeKey) {
      if (!history || !history.length) return [];

      const lastPoint = history[history.length - 1];
      const lastDate = new Date(lastPoint[0] || new Date().toISOString());
      const msDay = 24 * 60 * 60 * 1000;

      let cutoffTime = null;

      switch (rangeKey) {
        case "WEEK":
          cutoffTime = lastDate.getTime() - 7 * msDay;
          break;
        case "MONTH":
          cutoffTime = lastDate.getTime() - 30 * msDay;
          break;
        case "SIX_MONTHS":
          cutoffTime = lastDate.getTime() - 182 * msDay;
          break;
        case "YEAR":
        default:
          cutoffTime = lastDate.getTime() - 365 * msDay;
          break;
      }

      return history.filter(([d]) => {
        const t = new Date(d).getTime();
        return !Number.isNaN(t) && t >= cutoffTime;
      });
    }

    function renderCharts(divideBy12, newRangeKey) {
      if (!summary) return;

      if (newRangeKey) currentRange = newRangeKey;

      const f = divideBy12 ? 12 : 1;

      const dashboard = document.getElementById("dashboard");
      dashboard.innerHTML = "";
      destroyCharts();

      const totals = summary.totals || { value: 0, cost: 0, profit: 0, pct: null };
      const positions = Array.isArray(summary.positions) ? summary.positions : [];
      const symbolHistory = summary.symbolHistory || {};

      // PIE
      const pieCard = document.createElement("div");
      pieCard.className = "chart-card";
      pieCard.innerHTML = `
        <div class="chart-card-header">
          <h2>Allocation ${f>1 ? "(per 1 of 12)" : ""}</h2>
        </div>
        <div class="chart-container"><canvas id="summaryPie"></canvas></div>
      `;
      dashboard.appendChild(pieCard);

      const pieLabels = positions.map(p => p.symbol);
      const pieData = positions.map(p => Number(p.value || 0) / f);
      charts.push(new Chart(document.getElementById("summaryPie"), {
        type: "doughnut",
        data: { labels: pieLabels, datasets: [{ data: pieData }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: "right", labels: { color: "#fff" } } },
          elements: { arc: { borderWidth: 0 } }
        }
      }));

      // BAR totals
      const barCard = document.createElement("div");
      barCard.className = "chart-card";
      barCard.innerHTML = `
        <div class="chart-card-header">
          <h2>Portfolio summary ${f>1 ? "(per 1 of 12)" : ""}</h2>
        </div>
        <div class="chart-container"><canvas id="summaryBar"></canvas></div>
      `;
      dashboard.appendChild(barCard);

      charts.push(new Chart(document.getElementById("summaryBar"), {
        type: "bar",
        data: {
          labels: ["Spent", "Profit", "Value"],
          datasets: [{
            label: "NZD",
            data: [ (totals.cost || 0) / f, (totals.profit || 0) / f, (totals.value || 0) / f ]
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: v => "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2 }) },
              grid: { color: "#444", borderColor: "#444" }
            },
            x: { grid: { color: "#444" } }
          },
          plugins: { legend: { display: false } }
        }
      }));

      // LINE with range tabs (portfolio history)
      const lineCard = document.createElement("div");
      lineCard.className = "chart-card";
      lineCard.innerHTML = `
        <div class="chart-card-header">
          <h2>Portfolio value over time</h2>
        </div>
        <div class="range-tabs">
          <button class="range-tab" data-range="WEEK">Week</button>
          <button class="range-tab" data-range="MONTH">Month</button>
          <button class="range-tab" data-range="SIX_MONTHS">6 Months</button>
          <button class="range-tab" data-range="YEAR">1 Year</button>
        </div>
        <div class="chart-container"><canvas id="portfolioValueLine"></canvas></div>
      `;
      dashboard.appendChild(lineCard);

      const fullHistory = Array.isArray(summary.history) ? summary.history : [];
      const rangedHistory = fullHistory.length
        ? filterHistoryByRange(fullHistory, currentRange)
        : [];

      const historyForChart = rangedHistory.length ? rangedHistory : fullHistory;

      const lineLabels = historyForChart.length
        ? historyForChart.map(p => p[0])
        : [summary.lastUpdated || new Date().toISOString()];

      const lineData = historyForChart.length
        ? historyForChart.map(p => Number(p[1] || 0))
        : [totals.value || 0];

      charts.push(new Chart(document.getElementById("portfolioValueLine"), {
        type: "line",
        data: {
          labels: lineLabels,
          datasets: [{
            label: "Portfolio value NZD",
            data: lineData,
            fill: false,
            tension: 0.1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              beginAtZero: true,
              ticks: { callback: v => "$" + Number(v).toLocaleString(undefined, { minimumFractionDigits: 2 }) },
              grid: { color: "#444", borderColor: "#444" }
            },
            x: { grid: { color: "#444" } }
          },
          plugins: { legend: { labels: { color: "#fff" } } }
        }
      }));

      // range tab handlers
      const tabs = lineCard.querySelectorAll(".range-tab");
      tabs.forEach(tab => {
        const rk = tab.getAttribute("data-range");
        if (rk === currentRange) {
          tab.classList.add("active");
        }
        tab.addEventListener("click", () => {
          currentRange = rk;
          renderCharts(divideToggle.checked, currentRange);
        });
      });

      // per holding cards with Summary / History toggle
      positions.forEach(p => {
        const sym = p.symbol;
        if (!tickerViewMode[sym]) tickerViewMode[sym] = "SUMMARY";

        const cost = Number(p.cost || 0) / f;
        const value = Number(p.value || 0) / f;
        const profit = Number(p.profit || 0) / f;
        const pct = p.pct != null ? Number(p.pct) : null;

        const card = document.createElement("div");
        card.className = "chart-card";

        const cardId = `chart-${sym}`;
        card.innerHTML = `
          <div class="chart-card-header">
            <h2>${sym}</h2>
            <div class="view-toggle" data-symbol="${sym}">
              <button type="button" data-view="SUMMARY">Summary</button>
              <button type="button" data-view="HISTORY">History</button>
            </div>
          </div>
          <div class="chart-container"><canvas id="${cardId}"></canvas></div>
        `;
        dashboard.appendChild(card);

        card.style.borderColor = profit >= 0 ? "#28a745" : "#dc3545";

        const viewToggle = card.querySelector(".view-toggle");
        const viewButtons = viewToggle.querySelectorAll("button");
        viewButtons.forEach(btn => {
          const v = btn.getAttribute("data-view");
          if (v === tickerViewMode[sym]) btn.classList.add("active");
          btn.addEventListener("click", () => {
            tickerViewMode[sym] = v;
            renderCharts(divideToggle.checked, currentRange);
          });
        });

        const mode = tickerViewMode[sym];

        if (mode === "HISTORY" && symbolHistory[sym]) {
          const symHistRaw = symbolHistory[sym] || [];
          const symHist = symHistRaw.map(([d, v]) => [d, Number(v) / f]);

          const labels = symHist.length
            ? symHist.map(p => p[0])
            : [summary.lastUpdated || new Date().toISOString()];

          const data = symHist.length
            ? symHist.map(p => p[1])
            : [value];

          charts.push(new Chart(document.getElementById(cardId), {
            type: "line",
            data: {
              labels,
              datasets: [{
                label: `${sym} value NZD`,
                data,
                fill: false,
                tension: 0.2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: {
                  beginAtZero: true,
                  ticks: { callback: v => money(v) },
                  grid: { color: "#444" }
                },
                x: { grid: { color: "#444" } }
              },
              plugins: {
                legend: { labels: { color: "#fff" } }
              }
            }
          }));
        } else {
          charts.push(new Chart(document.getElementById(cardId), {
            data: {
              labels: ["Cost", "Value", "Profit", "% Change"],
              datasets: [
                {
                  type: "bar",
                  label: "NZD",
                  data: [ cost, value, profit, null ]
                },
                {
                  type: "line",
                  label: "% Change",
                  data: [ null, null, null, pct ],
                  yAxisID: "PCT",
                  tension: 0.3,
                  pointRadius: 4,
                  fill: false
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: {
                  beginAtZero: true,
                  title: { display: true, text: "NZD" },
                  ticks: { callback: v => money(v) },
                  grid: { color: "#444" }
                },
                PCT: {
                  type: "linear",
                  position: "right",
                  title: { display: true, text: "% Change" },
                  grid: { drawOnChartArea: false },
                  ticks: { callback: v => (v == null ? "n/a" : v + "%") }
                }
              },
              plugins: {
                tooltip: {
                  callbacks: {
                    label: ctx => {
                      if (ctx.dataset.type === "line") {
                        const y = ctx.parsed.y;
                        return "% Change: " + (y == null ? "n/a" : y + "%");
                      }
                      return "NZD " + money(ctx.parsed.y);
                    }
                  }
                },
                legend: { position: "bottom" }
              }
            }
          }));
        }
      });
    }

    (async () => {
      await loadSummary();
      if (!summary) return;

      await loadHistoryFromTable(); // builds summary.history and summary.symbolHistory from past rows

      renderCharts(false);
      divideToggle.addEventListener("change", e => renderCharts(e.target.checked));
    })();
  </script>
</body>
</html>
