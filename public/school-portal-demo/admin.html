<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Portfolio OS</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f; color: #e0e0e0;
    }
    header { 
      display: flex; align-items: center; justify-content: space-between; 
      margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;
    }
    h1 { margin: 0; font-size: 1.8rem; font-weight: 800; text-transform: uppercase; color: #a1a1aa; }
    
    .btn {
      padding: .6rem 1rem; border-radius: 8px; border: 1px solid #333;
      background: #1f1f1f; color: #fff; cursor: pointer; text-decoration: none; font-size: 0.9rem;
      font-weight: 600; transition: 0.2s;
    }
    .btn:hover { background: #2a2a2a; }
    .btn-primary { background: #3b82f6; border-color: #2563eb; }
    .btn-primary:hover { background: #2563eb; }
    .btn-accent { background: #f59e0b; border-color: #d97706; color: #000; } 
    .btn-accent:hover { background: #d97706; }
    
    /* New Refresh Button Style */
    .btn-refresh { background: #10b981; border-color: #059669; color: #000; }
    .btn-refresh:hover { background: #059669; }

    .container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    
    .section-title { 
        color: #f59e0b; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; margin-top: 1rem;
        border-bottom: 1px solid #333; padding-bottom: 0.5rem;
    }

    .card {
      background: #18181b; border: 1px solid #27272a; border-radius: 16px;
      padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .card h2 { margin: 0 0 1rem 0; font-size: 1.1rem; font-weight: 600; color: #fff; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .full-width { grid-column: span 2; }
    
    .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
    label { font-size: 0.8rem; text-transform: uppercase; color: #71717a; font-weight: 600; }
    
    input, select {
      background: #27272a; border: 1px solid #3f3f46; color: #fff;
      padding: 0.75rem; border-radius: 8px; font-size: 1rem; outline: none; width: 100%; box-sizing: border-box;
    }
    input:focus, select:focus { border-color: #3b82f6; }

    .table-container { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 500px; }
    th { text-align: left; color: #71717a; font-size: 0.75rem; text-transform: uppercase; padding-bottom: 0.5rem; border-bottom: 1px solid #27272a; }
    td { padding: 0.75rem 0; border-bottom: 1px solid #27272a; color: #d4d4d8; }
    
    .badge { padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
    .badge-buy { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-sell { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    
    .text-right { text-align: right; }
    .delete-btn { background: none; border: none; color: #52525b; cursor: pointer; font-size: 1.2rem; padding: 0 10px; }
    .delete-btn:hover { color: #ef4444; }

    #message { padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; text-align: center; }
    .success { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); }
    .error { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <header class="container">
    <div>
        <h1>OS Admin</h1>
    </div>
    <div style="display:flex; gap:0.5rem;">
        <button onclick="triggerSync()" class="btn btn-refresh">Force Refresh Data</button>
        <a href="index.html" class="btn">Back to Dashboard</a>
    </div>
  </header>

  <div class="container">
    <div id="message"></div>

    <div class="section-title">Main Portfolio</div>

    <div class="card">
      <h2>Record New Trade</h2>
      <form id="tradeForm">
        <div class="form-grid">
          <div class="form-group"><label>Symbol</label><input type="text" id="symbol" placeholder="e.g. NKE" required style="text-transform: uppercase;"></div>
          <div class="form-group"><label>Type</label><select id="type"><option value="BUY">BUY</option><option value="SELL">SELL</option></select></div>
          <div class="form-group"><label>Quantity</label><input type="number" id="quantity" placeholder="0" step="any" required></div>
          <div class="form-group"><label>Price per Share</label><input type="number" id="price" placeholder="0.00" step="any" required></div>
          <div class="full-width" style="margin-top: 0.5rem;"><button type="submit" class="btn btn-primary" style="width:100%;">Record Trade</button></div>
        </div>
      </form>
    </div>

    <div class="card">
      <h2>Recent Transactions</h2>
      <div class="table-container">
        <table>
          <thead><tr><th>Date</th><th>Symbol</th><th>Type</th><th class="text-right">Qty</th><th class="text-right">Price</th><th></th></tr></thead>
          <tbody id="historyTable"></tbody>
        </table>
      </div>
    </div>

    <div class="section-title">Winnerland ETF</div>

    <div class="card" style="border-color: #f59e0b;">
      <h2 style="color: #f59e0b;">Manage ETF Member</h2>
      <form id="etfForm">
        <div class="form-grid">
          <div class="form-group"><label>Member Name</label><input type="text" id="etfName" placeholder="e.g. Alex" required></div>
          <div class="form-group"><label>Stock Ticker</label><input type="text" id="etfTicker" placeholder="e.g. NVDA" required style="text-transform: uppercase;"></div>
          <div class="form-group full-width"><label>Entry Price ($)</label><input type="number" id="etfStart" placeholder="Price they bought at" step="any" required></div>
          
          <div class="full-width" style="margin-top: 0.5rem;"><button type="submit" class="btn btn-accent" style="width:100%;">Save Member</button></div>
        </div>
      </form>
    </div>

    <div class="card">
        <h2>ETF Leaderboard List</h2>
        <div class="table-container">
          <table>
            <thead><tr><th>Member</th><th>Ticker</th><th class="text-right">Entry</th><th class="text-right">Current (Live)</th><th class="text-right">Return</th><th></th></tr></thead>
            <tbody id="etfTable"></tbody>
          </table>
        </div>
      </div>

  </div>

  <script>
    // --- 1. SETUP SUPABASE ---
    if (typeof window.supabase === 'undefined') { throw new Error("Supabase library not found."); }
    
    // Credentials
    const SUPABASE_URL = "https://acdlgvcxzxjvcwiqlydj.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZGxndmN4enhqdmN3aXFseWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2Mjc5NzksImV4cCI6MjA3MjIwMzk3OX0.9ZUURjJT73Igd2tAOv8aSZUmlkEf7DIzmOAGBSjWqCI";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ** IMPORTANT: REPLACE THIS with your actual Edge Function URL **
    // You can find this in Supabase Dashboard -> Edge Functions
    const EDGE_FUNCTION_URL = "https://acdlgvcxzxjvcwiqlydj.supabase.co/functions/v1/update-prices"; 

    // --- 2. DOM ELEMENTS ---
    const form = document.getElementById('tradeForm');
    const tableBody = document.getElementById('historyTable');
    const msgBox = document.getElementById('message');

    // ETF DOM
    const etfForm = document.getElementById('etfForm');
    const etfTable = document.getElementById('etfTable');

    // --- 3. STARTUP ---
    init();

    async function init() {
      const { data: { session } } = await db.auth.getSession();
      if (!session) window.location.href = "login.html";
      
      // Load both datasets
      loadHistory();
      loadEtf();
    }

    // ==========================================
    //  SECTION A: MAIN PORTFOLIO LOGIC
    // ==========================================

    async function loadHistory() {
      const { data, error } = await db.from('trades').select('*').order('date', { ascending: false }).limit(20);
      
      if (error) { showMsg("Error loading history", "error"); return; }
      
      tableBody.innerHTML = "";
      if(!data || data.length === 0) {
        tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:2rem; color:#52525b'>No trades yet.</td></tr>";
        return;
      }

      data.forEach(trade => {
        const date = new Date(trade.date).toLocaleDateString();
        const badgeClass = trade.type === 'BUY' ? 'badge-buy' : 'badge-sell';
        tableBody.innerHTML += `
          <tr>
            <td style="white-space:nowrap;">${date}</td>
            <td style="font-weight:bold; color:#fff;">${trade.symbol}</td>
            <td><span class="badge ${badgeClass}">${trade.type}</span></td>
            <td class="text-right">${Number(trade.quantity).toLocaleString()}</td>
            <td class="text-right">$${Number(trade.price).toLocaleString()}</td>
            <td class="text-right"><button class="delete-btn" onclick="deleteTrade('${trade.id}')">&times;</button></td>
          </tr>`;
      });
    }

    form.onsubmit = async (e) => {
      e.preventDefault();
      showMsg("Saving trade...", "success"); 

      const symbol = document.getElementById('symbol').value.toUpperCase().trim();
      const type = document.getElementById('type').value;
      const qty = parseFloat(document.getElementById('quantity').value);
      const price = parseFloat(document.getElementById('price').value);

      const { error } = await db.from('trades').insert({
        symbol, type, quantity: qty, price, date: new Date().toISOString()
      });

      if (error) return showMsg("Error saving trade: " + error.message, "error");
      
      // We no longer calculate locally, we trigger the Edge Function for everything
      triggerSync();
      
      form.reset();
      document.getElementById('symbol').focus();
      loadHistory();
    };

    window.deleteTrade = async (id) => {
      if (!confirm("Delete this trade?")) return;
      const { error } = await db.from('trades').delete().eq('id', id);
      if(error) return alert("Error: " + error.message);
      triggerSync();
      loadHistory();
    };

    // ==========================================
    //  SECTION B: WINNERLAND ETF LOGIC
    // ==========================================

    async function loadEtf() {
        const { data, error } = await db.from('etf_members').select('*').order('name', { ascending: true });

        if (error) { console.error(error); return; }

        etfTable.innerHTML = "";
        if(!data || data.length === 0) {
            etfTable.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:2rem; color:#52525b'>No members found.</td></tr>";
            return;
        }

        data.forEach(m => {
            const ret = ((m.current_price - m.start_price) / m.start_price) * 100;
            const color = ret >= 0 ? '#34d399' : '#f87171';
            
            etfTable.innerHTML += `
            <tr>
                <td style="font-weight:bold; color:#fff;">${m.name}</td>
                <td><span class="badge" style="background:#333; color:#fff;">${m.ticker}</span></td>
                <td class="text-right">$${m.start_price}</td>
                <td class="text-right" style="color:#fff; font-weight:bold;">$${m.current_price}</td>
                <td class="text-right" style="color:${color}">${ret > 0 ? '+' : ''}${ret.toFixed(2)}%</td>
                <td class="text-right"><button class="delete-btn" onclick="deleteMember('${m.id}')">&times;</button></td>
            </tr>`;
        });
    }

    etfForm.onsubmit = async (e) => {
        e.preventDefault();
        showMsg("Saving Member...", "success");

        const name = document.getElementById('etfName').value.trim();
        const ticker = document.getElementById('etfTicker').value.toUpperCase().trim();
        const start_price = parseFloat(document.getElementById('etfStart').value);
        
        // We initialize current_price as start_price. 
        // It will be updated to the real live price the next time "Sync" runs.
        const { error } = await db.from('etf_members').insert({
            name, ticker, start_price, current_price: start_price
        });

        if(error) return showMsg(error.message, "error");

        showMsg("Member Saved. Updating prices...", "success");
        etfForm.reset();
        loadEtf();
        triggerSync(); // Auto-trigger sync to get correct price immediately
    }

    window.deleteMember = async (id) => {
        if(!confirm("Remove this member?")) return;
        const { error } = await db.from('etf_members').delete().eq('id', id);
        if(error) return showMsg(error.message, "error");
        loadEtf();
        triggerSync();
    }

    // ==========================================
    //  SECTION C: FORCE SYNC
    // ==========================================

    async function triggerSync() {
        showMsg("Syncing with live markets...", "success");
        try {
            // Call the Edge Function
            const res = await fetch(EDGE_FUNCTION_URL, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${SUPABASE_KEY}`,
                    'Content-Type': 'application/json'
                }
            });
            
            const json = await res.json();
            
            if(res.ok) {
                showMsg("Sync Complete!", "success");
                loadEtf(); // Reload table to show new prices
            } else {
                console.error(json);
                showMsg("Sync Failed (Check Console)", "error");
            }
        } catch(err) {
            console.error(err);
            // Fallback: If edge function fails/doesn't exist yet, we just warn.
            showMsg("Sync Trigger Failed (Is Edge Function deployed?)", "error");
        }
    }

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = type;
      msgBox.style.display = 'block';
      setTimeout(() => { msgBox.style.display = 'none'; }, 4000);
    }
  </script>
</body>
</html>
