<script>
  // --- CONFIG ---
  if (!window.supabaseInstance) {
    const SUPABASE_URL = "https://acdlgvcxzxjvcwiqlydj.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZGxndmN4enhqdmN3aXFseWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2Mjc5NzksImV4cCI6MjA3MjIwMzk3OX0.9ZUURjJT73Igd2tAOv8aSZUmlkEf7DIzmOAGBSjWqCI";
    window.supabaseInstance = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
  var supabase = window.supabaseInstance;

  // --- DOM ELEMENTS ---
  const form = document.getElementById('tradeForm');
  const tableBody = document.getElementById('historyTable');
  const msgBox = document.getElementById('message');

  // --- INIT ---
  init();

  async function init() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) window.location.href = "login.html";
    loadHistory();
  }

  // --- LOAD HISTORY ---
  async function loadHistory() {
    const { data, error } = await supabase
      .from('trades')
      .select('*')
      .order('date', { ascending: false })
      .limit(15);

    if (error) { showMsg("Error loading history", "error"); return; }
    
    tableBody.innerHTML = "";
    if(!data || data.length === 0) {
      tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center; padding:2rem; color:#52525b'>No trades recorded yet.</td></tr>";
      return;
    }

    data.forEach(trade => {
      const date = new Date(trade.date).toLocaleDateString();
      const badgeClass = trade.type === 'BUY' ? 'badge-buy' : 'badge-sell';
      const row = `
        <tr>
          <td style="white-space:nowrap;">${date}</td>
          <td style="font-weight:bold; color:#fff;">${trade.symbol}</td>
          <td><span class="badge ${badgeClass}">${trade.type}</span></td>
          <td class="text-right">${Number(trade.quantity).toLocaleString()}</td>
          <td class="text-right">$${Number(trade.price).toLocaleString()}</td>
          <td class="action-col">
            <button class="delete-btn" onclick="deleteTrade('${trade.id}')" title="Delete Trade">&times;</button>
          </td>
        </tr>`;
      tableBody.innerHTML += row;
    });
  }

  // --- SUBMIT TRADE ---
  form.onsubmit = async (e) => {
    e.preventDefault();
    showMsg("Processing...", "success"); // Show temp status

    const symbol = document.getElementById('symbol').value.toUpperCase().trim();
    const type = document.getElementById('type').value;
    const qty = parseFloat(document.getElementById('quantity').value);
    const price = parseFloat(document.getElementById('price').value);

    // 1. Insert into Ledger (Trades)
    const { error } = await supabase.from('trades').insert({
      symbol: symbol, type: type, quantity: qty, price: price, date: new Date().toISOString()
    });

    if (error) {
      showMsg("Error saving trade: " + error.message, "error");
      return;
    }

    // 2. TRIGGER DASHBOARD UPDATE
    await updateDashboardData();

    showMsg("Trade recorded & Dashboard updated!", "success");
    form.reset();
    document.getElementById('symbol').focus();
    loadHistory();
  };

  // --- DELETE TRADE ---
  window.deleteTrade = async (id) => {
    const pwd = prompt("Enter password to confirm deletion:");
    if (pwd !== "admin") return showMsg("Incorrect password.", "error");

    const { error } = await supabase.from('trades').delete().eq('id', id);
    if(error) {
      showMsg("Failed to delete: " + error.message, "error");
    } else {
      await updateDashboardData(); // Recalculate after delete
      showMsg("Trade deleted & Dashboard recalculated.", "success");
      loadHistory();
    }
  };

  // --- THE MAGIC FUNCTION: CALCULATE & UPDATE DASHBOARD ---
  async function updateDashboardData() {
    // 1. Fetch ALL trades
    const { data: trades } = await supabase.from('trades').select('*').order('date', {ascending: true});
    if(!trades) return;

    // 2. Replay history to calculate holdings
    let portfolio = {}; // Key: Symbol -> { qty, cost, lastPrice }

    trades.forEach(t => {
      if(!portfolio[t.symbol]) portfolio[t.symbol] = { qty: 0, cost: 0, lastPrice: 0 };
      const p = portfolio[t.symbol];
      const q = Number(t.quantity);
      const val = Number(t.price);

      p.lastPrice = val; // Always update market price to latest trade price

      if(t.type === 'BUY') {
        p.cost += (q * val);
        p.qty += q;
      } else {
        // When selling, we reduce cost basis proportionally (Average Cost method)
        if(p.qty > 0) {
          const avgCost = p.cost / p.qty;
          p.cost -= (q * avgCost);
          p.qty -= q;
        }
      }
    });

    // 3. Build Summary Object
    let positions = [];
    let totalValue = 0;
    let totalCost = 0;

    for (const [sym, data] of Object.entries(portfolio)) {
      if(data.qty < 0.0001) continue; // Skip sold out positions

      const mktValue = data.qty * data.lastPrice;
      const profit = mktValue - data.cost;
      const pct = data.cost > 0 ? (profit / data.cost) * 100 : 0;

      totalValue += mktValue;
      totalCost += data.cost;

      positions.push({
        symbol: sym,
        quantity: data.qty,
        cost: data.cost,
        value: mktValue,
        profit: profit,
        pct: pct
      });
    }

    const totalProfit = totalValue - totalCost;
    const totalPct = totalCost > 0 ? (totalProfit / totalCost) * 100 : 0;

    const summaryPayload = {
      totals: { value: totalValue, cost: totalCost, profit: totalProfit, pct: totalPct },
      positions: positions.sort((a,b) => b.value - a.value) // Sort by biggest holdings
    };

    // 4. Push to 'flex_summary' table
    await supabase.from('flex_summary').insert({
      last_updated: new Date().toISOString(),
      data: summaryPayload
    });
  }

  // --- UTILS ---
  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = type;
    msgBox.style.display = 'block';
    setTimeout(() => { msgBox.style.display = 'none'; }, 3000);
  }
</script>
