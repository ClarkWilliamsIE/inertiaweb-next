<script>
    const SUPABASE_URL = "https://acdlgvcxzxjvcwiqlydj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZGxndmN4enhqdmN3aXFseWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2Mjc5NzksImV4cCI6MjA3MjIwMzk3OX0.9ZUURjJT73Igd2tAOv8aSZUmlkEf7DIzmOAGBSjWqCI";
    const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycby9-PQORBC7L27BItmvRVowsut2KAgcPyJxeDszODyouSxYB59pOf1TrIGm1SLQEIiccQ/exec";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let items = [], votes = [], myVotes = [];
    let pctMap = {};
    let expandedItems = new Set();

    const el = (id) => document.getElementById(id);
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&gt;","</":"&lt;/","'":"&#39;","\"":"&quot;" }[c] || c));
    const setLoading = (on) => el('loading').style.display = on ? 'flex' : 'none';
    const showMsg = (txt, ok=true) => { const m=el('msg'); m.textContent=txt; m.className=ok?'text-green':'text-red'; setTimeout(()=>m.textContent='',2000); };
    
    async function guard() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return location.href = "login.html";
      currentUser = session.user;
    }

    function loadPctJSONP(tickers) {
        return new Promise(resolve => {
            const cb = "CB_" + Math.random().toString(36).slice(2);
            window[cb] = (raw) => {
                delete window[cb]; document.getElementById(cb)?.remove();
                const map = {}; const data = raw?.data || {};
                for(let k in data) map[String(k).toUpperCase()] = data[k];
                resolve(map);
            };
            const s = document.createElement("script");
            s.id = cb;
            s.src = `${SHEET_WEBAPP_URL}?tickers=${encodeURIComponent(tickers)}&callback=${cb}&ts=${Date.now()}`;
            s.onerror = () => resolve({});
            document.body.appendChild(s);
        });
    }

    // 1. FAST LOAD (Supabase Only)
    async function fetchBasicData() {
        const [r1, r2] = await Promise.all([
            supabase.from("watchlist_items").select("*").order("created_at", {ascending:false}),
            supabase.from("watchlist_votes").select("item_id, user_id, value")
        ]);
        if(r1.error) console.error(r1.error);
        items = r1.data || [];
        votes = r2.data || [];
        myVotes = votes.filter(v => v.user_id === currentUser.id);
    }

    // 2. SLOW LOAD (Prices)
    async function fetchPrices() {
        const tickers = Array.from(new Set(items.map(i => (i.ticker||"").toUpperCase()).filter(Boolean))).join(",");
        if(tickers) {
            // Fetch prices silently
            const newMap = await loadPctJSONP(tickers);
            pctMap = newMap;
            render(); // Re-render with prices when they arrive
        }
    }

    function getScore(itemId) { return votes.filter(v => v.item_id === itemId).reduce((a,b) => a + (b.value||0), 0); }
    function getPctData(ticker) { return pctMap[(ticker||"").toUpperCase()] || null; }

    function render() {
        const term = el('search').value.toUpperCase();
        const archTerm = el('archSearch').value.toUpperCase();
        
        const active = items.filter(i => !i.archived).map(i => ({ ...i, score: getScore(i.id), myVote: myVotes.find(v => v.item_id === i.id)?.value || 0 }));
        active.sort((a,b) => b.score - a.score || a.ticker.localeCompare(b.ticker));

        // Active List
        const list = el('list'); list.innerHTML = "";
        if(active.length === 0) list.innerHTML = `<div class="muted" style="text-align:center; padding:2rem;">No items found</div>`;

        active.forEach(i => {
            if(term && !i.ticker.toUpperCase().includes(term)) return;
            const data = getPctData(i.ticker);
            const pctTxt = data ? (data.pct * 100).toFixed(2) + "%" : "n/a";
            const priceTxt = data && data.price ? "$" + Number(data.price).toFixed(2) : "-";
            let stCls="neutral", pctCls="muted";
            if(data) { if(data.pct>=0) { stCls="up"; pctCls="up"; } else { stCls="down"; pctCls="down"; } }

            const isExpanded = expandedItems.has(i.id);

            const card = document.createElement('div');
            card.className = `ticker-card ${stCls} ${isExpanded ? 'expanded' : ''}`;
            card.innerHTML = `
                <div class="ticker-header">
                    <div class="vote-box ${i.myVote===1?'active':''}" onclick="toggleVote('${i.id}')">
                        <div class="vote-count">${i.score}</div>
                        <div class="vote-lbl">Vote</div>
                    </div>
                    <div class="ticker-content" onclick="toggleExpand('${i.id}')">
                        <div class="ticker-symbol">
                            ${escapeHtml(i.ticker)} <span class="market-badge">${i.ticker.length>4?'CRYPTO':'STOCK'}</span>
                        </div>
                        <div class="ticker-note">${escapeHtml(i.notes || "No notes")}</div>
                        <div class="suggester">By ${escapeHtml(i.suggested_by_name || "Member")}</div>
                    </div>
                    <div class="price-box">
                        <div class="pct-lg ${pctCls}">${pctTxt}</div>
                        <div class="price-sm">${priceTxt}</div>
                    </div>
                    <div class="actions">
                        <button class="btn-icon btn-expand" onclick="toggleExpand('${i.id}')">
                             <svg viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"></path></svg>
                        </button>
                        <button class="btn-icon" onclick="toggleArchive('${i.id}', true)">
                            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>
                        </button>
                    </div>
                </div>
                <div class="ticker-body">
                    <strong style="color:#fff;">Full Notes:</strong><br/>
                    ${escapeHtml(i.notes || "No additional notes provided.")}
                </div>
            `;
            list.appendChild(card);
        });

        // Leaderboard
        const uStats = {};
        items.forEach(i => {
            const n = i.suggested_by_name || "Anon";
            const d = getPctData(i.ticker);
            if(d) {
                if(!uStats[n]) uStats[n] = { c:0, s:0 };
                uStats[n].c++; uStats[n].s += d.pct;
            }
        });
        const leaders = Object.keys(uStats).map(n => ({ name:n, count:uStats[n].c, avg:uStats[n].s/uStats[n].c })).sort((a,b)=>b.avg-a.avg);
        const lWrap = el('leaderWrap'); lWrap.innerHTML = "";
        if(leaders.length===0) lWrap.innerHTML=`<div class="muted">No data yet</div>`;
        leaders.forEach((l, idx) => {
            const ab = l.avg>=0 ? "up":"down";
            lWrap.innerHTML += `
                <div class="leader-row">
                    <div class="rank">${idx+1}</div>
                    <div class="avatar">${l.name.substring(0,2).toUpperCase()}</div>
                    <div class="player-info">
                        <div class="player-name">${escapeHtml(l.name)}</div>
                        <div class="suggester">${l.count} picks</div>
                    </div>
                    <div class="perf-badge ${ab}">${(l.avg*100).toFixed(2)}%</div>
                </div>
            `;
        });

        // Archive
        const aList = el('archList'); aList.innerHTML = "";
        items.filter(i=>i.archived).forEach(i => {
            if(archTerm && !i.ticker.toUpperCase().includes(archTerm)) return;
            const d = getPctData(i.ticker);
            const col = d ? (d.pct>=0?'text-green':'text-red') : 'muted';
            const txt = d ? (d.pct*100).toFixed(2)+"%" : "n/a";
            aList.innerHTML += `
                <div style="display:flex; justify-content:space-between; padding:0.5rem 0; border-bottom:1px solid #27272a; font-size:0.85rem;">
                    <div><strong>${i.ticker}</strong> <span class="${col}">${txt}</span></div>
                    <button class="btn-ghost" style="padding:2px 6px; font-size:0.7rem;" onclick="toggleArchive('${i.id}', false)">Restore</button>
                </div>
            `;
        });
    }

    async function addItem() {
        const t = el('ticker').value.trim().toUpperCase();
        if(!t) return showMsg("Enter symbol", false);
        el('addBtn').disabled = true;
        
        try {
            const name = (currentUser.user_metadata?.first_name) || currentUser.email.split('@')[0];
            const {error} = await supabase.from("watchlist_items").insert({
                ticker: t, notes: el('notes').value.trim(), created_by: currentUser.id, suggested_by_name: name, archived: false
            });
            if(error) throw error;
            
            fetch(SHEET_WEBAPP_URL, { method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain"}, body:JSON.stringify({ticker:t, notes:el('notes').value, user_id:currentUser.id}) });
            
            el('ticker').value=""; el('notes').value="";
            showMsg("Added!");
            
            // Re-fetch basic data only to show the item immediately
            await fetchBasicData();
            render();
            // Then fetch price in bg
            fetchPrices();
        } catch(e) { showMsg("Error", false); }
        el('addBtn').disabled = false;
    }

    window.toggleExpand = (id) => {
        if(expandedItems.has(id)) expandedItems.delete(id);
        else expandedItems.add(id);
        render();
    };

    window.toggleVote = async (itemId) => {
        const exists = myVotes.find(v => v.item_id === itemId);
        if(exists) {
             myVotes = myVotes.filter(v => v.item_id !== itemId);
             const idx = votes.findIndex(v => v.item_id === itemId && v.user_id === currentUser.id);
             if(idx>-1) votes.splice(idx,1);
             supabase.from("watchlist_votes").delete().match({ item_id: itemId, user_id: currentUser.id }).then();
        } else {
             myVotes.push({ item_id: itemId, user_id: currentUser.id, value: 1 });
             votes.push({ item_id: itemId, user_id: currentUser.id, value: 1 });
             supabase.from("watchlist_votes").insert({ item_id: itemId, user_id: currentUser.id, value: 1 }).then();
        }
        render();
    };

    window.toggleArchive = async (id, state) => {
        await supabase.from("watchlist_items").update({archived:state}).eq("id", id);
        await fetchBasicData(); render();
    };

    el('addBtn').onclick = addItem;
    el('search').oninput = render; el('archSearch').oninput = render;
    el('btnSignOut').onclick = async () => { await supabase.auth.signOut(); location.href="login.html"; };

    const ch = supabase.channel('public:watchlist');
    ch.on('postgres_changes', { event:'*', schema:'public', table:'watchlist_items' }, async()=>{ await fetchBasicData(); render(); fetchPrices(); });
    ch.on('postgres_changes', { event:'*', schema:'public', table:'watchlist_votes' }, async()=>{ await fetchBasicData(); render(); });
    ch.subscribe();

    (async () => {
        setLoading(true);
        await guard();
        
        // 1. Load Basic Data
        await fetchBasicData();
        
        // 2. RENDER IMMEDIATELY (Stop Loading Wheel)
        render();
        setLoading(false);

        // 3. Fetch Prices in Background
        await fetchPrices();
        
        setInterval(async () => { 
            const t = Array.from(new Set(items.map(i=>(i.ticker||"").toUpperCase()).filter(Boolean))).join(",");
            if(t) { pctMap = await loadPctJSONP(t); render(); }
        }, 60000);
    })();

  </script>
