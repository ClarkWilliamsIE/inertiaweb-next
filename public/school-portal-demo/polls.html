]<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Polls</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 1rem;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f0f; color: #e0e0e0;
    }
    * { box-sizing: border-box; }

    /* --- LAYOUT --- */
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    .row { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    
    /* --- UI ELEMENTS --- */
    .btn {
      padding: .5rem .85rem; border-radius: 8px; border: 1px solid #333;
      background: #1f1f1f; color: #fff; cursor: pointer; transition: 0.2s;
      font-weight: 500; font-size: 0.85rem;
    }
    .btn:hover { background: #2a2a2a; transform: translateY(-1px); }
    .btn-cta { background: #3b82f6; border-color: #3b82f6; }
    .btn-cta:hover { background: #2563eb; }
    .btn-ghost { background: transparent; border-color: dashed #444; color: #a1a1aa; }
    .btn-ghost:hover { border-color: #666; color: #fff; }
    .danger { border-color: #7f1d1d; color: #fca5a5; }
    .danger:hover { background: #450a0a; }

    input {
      background: #18181b; border: 1px solid #27272a; color: #fff;
      border-radius: 8px; padding: 0.6rem 0.8rem; font-size: 0.9rem;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #3b82f6; }

    /* --- CARDS --- */
    .card {
      background: #18181b; border: 1px solid #27272a; border-radius: 16px;
      padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-bottom: 1.5rem;
    }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .section-title { font-size: 1.1rem; font-weight: 600; color: #fff; margin: 0; }

    /* --- POLL STYLES --- */
    .poll-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
    
    .poll-card {
      background: #0f0f0f; border: 1px solid #27272a; border-radius: 12px;
      padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem;
      position: relative; overflow: hidden;
    }
    .poll-card::before { content:""; position:absolute; top:0; left:0; right:0; height:3px; background: #3f3f46; }
    .poll-card.active::before { background: #3b82f6; }
    .poll-card.ended::before { background: #ef4444; }

    .poll-meta { display: flex; justify-content: space-between; align-items: flex-start; }
    .poll-title { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 0.25rem; }
    .poll-timer { font-size: 0.8rem; color: #a1a1aa; font-variant-numeric: tabular-nums; }
    
    .options-list { display: flex; flex-direction: column; gap: 0.75rem; }
    
    .option-item {
      position: relative;
      border: 1px solid #333; border-radius: 8px;
      background: #18181b; overflow: hidden;
      cursor: pointer; transition: border-color 0.2s;
      display: flex; flex-direction: column;
    }
    .option-item:hover { border-color: #555; }
    
    /* Blue border if I voted */
    .option-item.voted { border-color: #3b82f6; }
    
    /* Green border if 6+ votes (Overrides blue) */
    .option-item.good { border-color: #22c55e; box-shadow: 0 0 0 1px #22c55e; }

    /* Progress Bar */
    .progress-bar {
      position: absolute; top: 0; bottom: 0; left: 0;
      background: rgba(255, 255, 255, 0.08);
      z-index: 0; transition: width 0.5s ease-out;
    }
    .voted .progress-bar { background: rgba(59, 130, 246, 0.2); } /* Blue tint */
    .good .progress-bar { background: rgba(34, 197, 94, 0.2); } /* Green tint */

    /* Content Layout */
    .option-row-main {
      position: relative; z-index: 1;
      padding: 0.75rem 1rem;
      display: flex; justify-content: space-between; align-items: center;
    }
    .opt-label { font-weight: 500; font-size: 0.95rem; }
    .opt-stat { font-size: 0.85rem; color: #a1a1aa; font-weight: 700; }

    /* The Chips / Leaderboard */
    .chips-row {
      position: relative; z-index: 1;
      padding: 0 1rem 0.75rem 1rem;
      display: flex; flex-wrap: wrap; gap: 0.35rem;
    }
    .chip {
      display: inline-flex; align-items: center; 
      padding: 2px 8px; border: 1px solid #333; border-radius: 99px;
      font-size: 0.7rem; color: #a1a1aa; background: #111;
    }
    .chip.me { border-color: #3b82f6; color: #fff; background: rgba(59, 130, 246, 0.1); }

    /* New: Add Option Row for Live Polls */
    .add-opt-row {
      margin-top: 1rem; padding-top: 0.75rem; border-top: 1px dashed #333;
      display: flex; gap: 0.5rem;
    }
    .add-opt-row input { flex: 1; font-size: 0.85rem; padding: 0.4rem 0.8rem; background: #111; }

    /* Scrollable Box for Past Results */
    .scroll-box {
      max-height: 500px;
      overflow-y: auto;
      border: 1px solid #27272a;
      background: #121212;
      border-radius: 12px;
      padding: 1rem;
    }
    .scroll-box::-webkit-scrollbar { width: 8px; }
    .scroll-box::-webkit-scrollbar-track { background: #18181b; }
    .scroll-box::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

    .badge { 
      font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 4px; 
      text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px;
    }
    .bg-blue { background: #1e3a8a; color: #93c5fd; }
    .bg-red { background: #450a0a; color: #fca5a5; }

    .muted { color: #71717a; font-size: 0.9rem; }
    .loading-veil { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(4px); }
    .spinner { width:24px; height:24px; border:3px solid #333; border-top-color:#3b82f6; border-radius:50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #pageErr { display:none; background:#7f1d1d; color:#fee2e2; padding:1rem; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>Polls</h1>
    <div class="row">
      <button class="btn" onclick="location.href='members.html'">Dashboard</button>
      <button class="btn" onclick="location.href='watchlist.html'">Watchlist</button>
      <button class="btn danger" id="btnSignOut">Sign out</button>
    </div>
  </header>

  <div id="pageErr"></div>
  <div id="loading" class="loading-veil" aria-hidden="true"><div class="spinner"></div></div>

  <main>
    <section class="card">
      <div class="section-head">
        <h2 class="section-title">Create New Poll</h2>
      </div>
      <div class="row">
        <input id="title" placeholder="What do you want to ask?" style="flex:1; min-width:250px;" />
        <input id="duration" type="number" min="1" max="72" value="48" style="width:100px;" placeholder="Hrs" />
        <span class="muted" style="font-size:0.8rem">Hours</span>
      </div>
      <div id="optionsWrap" style="display:flex; flex-direction:column; gap:.5rem; margin-top:0.5rem;"></div>
      <div class="row" style="justify-content:space-between; margin-top:0.5rem;">
        <button id="btnAddOpt" class="btn btn-ghost" type="button">+ Add Option</button>
        <button id="btnCreate" class="btn btn-cta">Launch Poll</button>
      </div>
    </section>

    <div class="section-head" style="margin-top:2rem;">
      <h2 class="section-title">Live Voting</h2>
      <input id="search" placeholder="Filter polls..." style="padding:0.4rem 0.8rem; font-size:0.85rem; width:200px;" />
    </div>
    <div id="activeList" class="poll-grid"></div>

    <div class="section-head" style="margin-top:3rem;">
      <h2 class="section-title muted">Past Results</h2>
    </div>
    <div class="scroll-box">
      <div id="archList" class="poll-grid"></div>
    </div>
  </main>

  <script>
    /* --- CONFIG --- */
    const SUPABASE_URL = "https://acdlgvcxzxjvcwiqlydj.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFjZGxndmN4enhqdmN3aXFseWRqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTY2Mjc5NzksImV4cCI6MjA3MjIwMzk3OX0.9ZUURjJT73Igd2tAOv8aSZUmlkEf7DIzmOAGBSjWqCI";
    const GREEN_THRESHOLD = 6; 
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /* --- STATE --- */
    let currentUser = null;
    let polls = [], options = [], votes = [];

    /* --- UTILS --- */
    const el = (id) => document.getElementById(id);
    const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c] || c));
    const showError = (msg) => { el('pageErr').style.display='block'; el('pageErr').textContent = msg; };
    const setLoading = (on) => el('loading').style.display = on ? 'flex' : 'none';

    async function guard() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return location.href = "login.html";
      currentUser = session.user;
    }

    /* --- DATA --- */
    async function fetchAll() {
      const [p, o, v] = await Promise.all([
        supabase.from("polls").select("*").order("created_at", { ascending:false }),
        supabase.from("poll_options").select("*"),
        supabase.from("poll_votes").select("*")
      ]);
      if (p.error) throw p.error;
      if (o.error) throw o.error;
      if (v.error) throw v.error;
      polls = p.data; options = o.data; votes = v.data;
    }

    /* --- RENDER LOGIC --- */
    function buildIndex() {
      const optByPoll = {};
      const votesByPoll = {};
      const votesByOpt = {};
      
      options.forEach(o => {
        if(!optByPoll[o.poll_id]) optByPoll[o.poll_id] = [];
        optByPoll[o.poll_id].push(o);
      });
      
      votes.forEach(v => {
        if(!votesByPoll[v.poll_id]) votesByPoll[v.poll_id] = [];
        votesByPoll[v.poll_id].push(v);
        
        if(!votesByOpt[v.option_id]) votesByOpt[v.option_id] = [];
        votesByOpt[v.option_id].push(v);
      });

      return { optByPoll, votesByPoll, votesByOpt };
    }

    function render() {
      const { optByPoll, votesByPoll, votesByOpt } = buildIndex();
      const term = el('search').value.toLowerCase();
      
      const activeWrap = el('activeList');
      const archWrap = el('archList');
      activeWrap.innerHTML = ""; archWrap.innerHTML = "";

      polls.forEach(p => {
        const isEnded = new Date(p.end_at) <= new Date();
        if (term && !p.title.toLowerCase().includes(term)) return;

        const pollOpts = optByPoll[p.id] || [];
        const pollVotes = votesByPoll[p.id] || [];
        const myVote = pollVotes.find(v => v.user_id === currentUser.id);
        const totalPollVotes = pollVotes.length;

        const card = document.createElement('div');
        card.className = `poll-card ${isEnded ? 'ended' : 'active'}`;
        
        let timeLabel = "Ended";
        if (!isEnded) {
            const diff = new Date(p.end_at) - new Date();
            const h = Math.floor(diff/3600000);
            timeLabel = `${h}h remaining`;
        }

        let html = `
          <div class="poll-meta">
            <div>
                <div class="poll-title">${escapeHtml(p.title)}</div>
                <div class="poll-timer">${timeLabel} • ${totalPollVotes} votes</div>
            </div>
            ${isEnded ? '<span class="badge bg-red">Ended</span>' : '<span class="badge bg-blue">Live</span>'}
          </div>
          <div class="options-list">
        `;

        pollOpts.sort((a,b) => a.label.localeCompare(b.label));

        pollOpts.forEach(o => {
          const vArr = votesByOpt[o.id] || []; 
          const count = vArr.length;
          const pct = totalPollVotes > 0 ? Math.round((count / totalPollVotes) * 100) : 0;
          const isMyVote = myVote && myVote.option_id === o.id;
          const isGood = count >= GREEN_THRESHOLD;

          let itemClass = "option-item";
          if (isMyVote) itemClass += " voted";
          if (isGood) itemClass += " good";

          let chipsHtml = '';
          if(vArr.length > 0) {
            chipsHtml = '<div class="chips-row">';
            vArr.forEach(vote => {
                const isMe = vote.user_id === currentUser.id;
                chipsHtml += `<span class="chip ${isMe?'me':''}">${escapeHtml(vote.voter_name || 'Anon')}</span>`;
            });
            chipsHtml += '</div>';
          }

          html += `
            <div class="${itemClass}" onclick="castVote('${p.id}', '${o.id}', ${isEnded})">
              <div class="progress-bar" style="width: ${pct}%"></div>
              
              <div class="option-row-main">
                <span class="opt-label">${escapeHtml(o.label)}</span>
                <span class="opt-stat">${pct}%</span>
              </div>
              
              ${chipsHtml}
            </div>
          `;
        });

        html += `</div>`; // Close options-list

        // --- ADD OPTION INPUT (ACTIVE ONLY) ---
        if (!isEnded) {
            html += `
                <div class="add-opt-row">
                  <input id="new-opt-${p.id}" placeholder="Add another option..." onkeydown="if(event.key==='Enter') addLiveOption('${p.id}')" />
                  <button class="btn btn-ghost" onclick="addLiveOption('${p.id}')" style="padding:0 0.8rem; font-size:1.2rem; line-height:1;">+</button>
                </div>
            `;
        }

        card.innerHTML = html;

        if (isEnded) archWrap.appendChild(card);
        else activeWrap.appendChild(card);
      });

      if(activeWrap.children.length === 0) activeWrap.innerHTML = `<div class="muted" style="grid-column:1/-1; text-align:center; padding:2rem;">No active polls right now.</div>`;
      if(archWrap.children.length === 0) archWrap.innerHTML = `<div class="muted" style="text-align:center;">No past polls.</div>`;
    }

    /* --- ACTIONS --- */
    async function createPoll() {
      const title = el('title').value.trim();
      const dur = Number(el('duration').value) || 48;
      const optInputs = document.querySelectorAll('.opt-input');
      const labels = Array.from(optInputs).map(i => i.value.trim()).filter(Boolean);

      if(!title || labels.length < 2) return alert("Title and at least 2 options required.");

      setLoading(true);
      const endAt = new Date(Date.now() + dur * 3600000).toISOString();
      
      const { data: poll, error } = await supabase.from("polls").insert({ title, created_by: currentUser.id, end_at: endAt }).select().single();
      if(error) { setLoading(false); return showError(error.message); }

      const optRows = labels.map(l => ({ poll_id: poll.id, label: l }));
      await supabase.from("poll_options").insert(optRows);

      el('title').value = "";
      resetInputs();
      await fetchAll();
      render();
      setLoading(false);
    }

    async function castVote(pollId, optId, isEnded) {
      if (isEnded) return; 
      setLoading(true);
      const displayName = (currentUser.user_metadata?.first_name) || currentUser.email.split('@')[0];
      
      const { error } = await supabase.from("poll_votes").upsert(
        { poll_id: pollId, option_id: optId, user_id: currentUser.id, voter_name: displayName },
        { onConflict: "poll_id, user_id" }
      );

      if(error) showError(error.message);
      else {
        await fetchAll();
        render();
      }
      setLoading(false);
    }

    // --- NEW: ADD LIVE OPTION ---
    async function addLiveOption(pollId) {
        const input = el(`new-opt-${pollId}`);
        const label = input.value.trim();
        if (!label) return;

        setLoading(true);
        const { error } = await supabase.from("poll_options").insert({
            poll_id: pollId,
            label: label
        });

        if (error) showError(error.message);
        else {
            // Input clears, subscription handles the refresh
            input.value = "";
        }
        setLoading(false);
    }

    /* --- HELPERS --- */
    function addInput() {
      const div = document.createElement('div');
      div.className = "row";
      div.innerHTML = `<input class="opt-input" placeholder="Option Label" style="flex:1" /> <button class="btn btn-ghost" onclick="this.parentElement.remove()">✕</button>`;
      el('optionsWrap').appendChild(div);
    }
    function resetInputs() {
      el('optionsWrap').innerHTML = "";
      addInput(); addInput();
    }

    el('btnCreate').onclick = createPoll;
    el('btnAddOpt').onclick = addInput;
    el('search').oninput = render;
    el('btnSignOut').onclick = async () => { await supabase.auth.signOut(); location.href="login.html"; };

    /* --- REALTIME --- */
    async function refresh() {
        await fetchAll();
        render();
    }

    // Subscribe to Votes AND Options
    supabase.channel('public:polls')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'poll_votes' }, refresh)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'poll_options' }, refresh)
      .subscribe();

    (async () => {
      setLoading(true);
      await guard();
      resetInputs();
      await fetchAll();
      render();
      setLoading(false);
    })();
  </script>
</body>
</html>
